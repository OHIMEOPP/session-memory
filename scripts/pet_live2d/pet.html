<!DOCTYPE html>
<!--
  Live2D 桌寵渲染頁 — pixi.js + pixi-live2d-display + 官方 Cubism Core。
  由 live2d_pet.py 的 QWebEngineView 載入（透明背景）。
  對外介面：window.setPetState('idle'|'busy'|'waiting'|'extracting'|'done')
  資源全走 CDN（jsdelivr / cubism 官方）；離線時 Python 端會退回顏文字寵。

  模型 URL / 初始狀態 / 是否顯示字幕 由 URL query 帶入：
    pet.html?model=<url>&state=idle&caption=1&scale=0.15
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    cursor: default;
  }
  #stage { display: block; width: 100%; height: 100%; background: transparent; }
  #caption {
    position: fixed; left: 0; right: 0; bottom: 6px;
    text-align: center;
    font-family: "Microsoft JhengHei UI", "Segoe UI", sans-serif;
    font-size: 12px; font-weight: 600;
    color: #f2f4ff;
    text-shadow: 0 1px 3px rgba(0,0,0,.85), 0 0 6px rgba(0,0,0,.6);
    pointer-events: none;
    opacity: 0; transition: opacity .25s;
  }
  #caption.show { opacity: 1; }
  #nametag {
    position: fixed; left: 0; right: 0; top: 4px; text-align: center;
    font-family: "Microsoft JhengHei UI", "Segoe UI", sans-serif;
    font-size: 12px; font-weight: 700; color: #ffe9a6;
    text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.7);
    pointer-events: none;
  }
  #err {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    font-family: sans-serif; font-size: 12px; color: #f5c2c7;
    text-align: center; padding: 12px; background: rgba(20,10,12,.5);
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="nametag"></div>
<div id="caption"></div>
<div id="err"></div>

<script>
// ---- 從 URL query 取參數 ----
const Q = new URLSearchParams(location.search);
const MODEL_URL = Q.get('model')
  || 'https://cdn.jsdelivr.net/gh/Live2D/CubismWebSamples@master/Samples/Resources/Wanko/Wanko.model3.json';
const SHOW_CAPTION = Q.get('caption') !== '0';
const FRAME = (Q.get('frame') || 'half').toLowerCase();   // half | full | head
const SCALE_OVERRIDE = Q.get('scale');                    // 給了就用固定縮放（覆蓋 frame）
let initialState = Q.get('state') || 'idle';

// ---- 狀態意圖（與模型無關）----
// 表情用「具名優先（prefs）→ 否則照索引（idx）」自動對應到該模型實際有的表情；
// motion='tap' 觸發該模型的拍打/招呼動作組（Tap/TapBody…），'idle' 走待機。
// 沒表情的模型（Hiyori/Mark/Rice/Wanko/狗）→ 只切動作+字幕，仍能區分狀態。
const STATE_INTENT = {
  idle:       { prefs: ['Normal', 'normal'],       idx: 0, motion: 'idle', caption: '' },
  busy:       { prefs: ['Normal', 'normal'],       idx: 0, motion: 'idle', caption: '作業中…' },
  waiting:    { prefs: ['Surprised', 'Smile'],     idx: 2, motion: 'tap',  caption: '等你回應 👀' },
  extracting: { prefs: ['Sad', 'Normal'],          idx: 3, motion: 'idle', caption: 'session 萃取中…' },
  done:       { prefs: ['Smile', 'Blushing'],      idx: 1, motion: 'tap',  caption: '處理完成 ✓' },
};

// 模型載入後填入：可用表情名清單、拍打動作組名
let EXPR = [];          // ['F01','F02',…] 或 [] (無表情模型)
let TAP_GROUP = null;   // 'Tap' / 'TapBody' / 首個非 Idle 組 / null

function introspect() {
  try {
    const s = model.internalModel.settings;
    EXPR = (s.expressions || []).map(e => e.Name || e.name).filter(Boolean);
    const groups = Object.keys(s.motions || {});
    TAP_GROUP = groups.find(g => /tap/i.test(g))
             || groups.find(g => !/idle/i.test(g)) || null;
  } catch (e) {}
}

function pickExpr(prefs, idx) {          // 具名優先，否則照索引夾範圍
  for (const p of prefs) {
    const hit = EXPR.find(n => n.toLowerCase() === p.toLowerCase());
    if (hit) return hit;
  }
  return EXPR.length ? EXPR[Math.min(idx, EXPR.length - 1)] : null;
}

const captionEl = document.getElementById('caption');
const errEl = document.getElementById('err');
const NAME = Q.get('name') || '';
if (NAME) document.getElementById('nametag').textContent = NAME;   // 預覽用名牌（常駐）
function fail(msg) { errEl.textContent = msg; errEl.style.display = 'flex'; }

// ---- 動態載入 CDN script（依序，cubismcore 必須先於 cubism4）----
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res;
    s.onerror = () => rej(new Error('load fail: ' + src));
    document.head.appendChild(s);
  });
}

let app = null, model = null, ready = false;

async function boot() {
  try {
    await loadScript('https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js');
    await loadScript('https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js');
    await loadScript('https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js');
  } catch (e) { return fail('資源載入失敗（離線？）\n' + e.message); }

  if (!window.PIXI || !PIXI.live2d) return fail('PIXI / live2d 未就緒');

  const canvas = document.getElementById('stage');
  // 固定解析度（不隨螢幕變）：避免跨不同 DPI 螢幕當下換 resolution → 緩衝重建造成的
  // 「閃一下變大變小」。取啟動螢幕 DPR 與 2 的較大值，確保到 200% 螢幕仍銳利；
  // 較低 DPI 螢幕上只是超採樣（更銳，無副作用）。佈局一律用邏輯尺寸，與此無關。
  const FIXED_RES = Math.max(window.devicePixelRatio || 1, 2);
  app = new PIXI.Application({
    view: canvas,
    width: window.innerWidth, height: window.innerHeight,
    backgroundAlpha: 0, antialias: true,
    autoDensity: true, resolution: FIXED_RES,
    // 保留 drawing buffer：否則 WebGL 畫完該幀就清掉、drawImage/readPixels 讀回全透明，
    // 逐像素穿透遮罩（computeMask 讀 #stage alpha）會抓不到狗的輪廓。代價極小（小窗）。
    preserveDrawingBuffer: true,
  });

  try {
    model = await PIXI.live2d.Live2DModel.from(MODEL_URL, { autoInteract: false });
  } catch (e) { return fail('模型載入失敗\n' + e.message); }

  app.stage.addChild(model);
  introspect();                  // 讀此模型實際有的表情/動作組
  fit();
  window.addEventListener('resize', fit);
  ready = true;
  setPetState(initialState);     // 套用初始狀態
}

// 視窗尺寸變動時只重排；解析度固定不動（跨螢幕不重建緩衝 → 不閃跳）。
function fit() {
  if (!app) return;
  app.renderer.resize(window.innerWidth, window.innerHeight);  // 邏輯尺寸通常不變 → 多為 no-op
  layout();
}

function layout() {
  if (!model || !app) return;
  const W = app.renderer.screen.width, H = app.renderer.screen.height;  // 邏輯尺寸（DPI 無關）
  const im = model.internalModel || {};
  const mw = im.width || 1000, mh = im.height || 1000;   // 模型邏輯尺寸（非縮放後）
  let s, ay, y;
  if (SCALE_OVERRIDE) {                 // 顯式縮放：置中
    s = parseFloat(SCALE_OVERRIDE); ay = 0.5; y = H * 0.52;
  } else if (FRAME === 'full') {        // 全身入鏡：整隻塞進窗、置中
    s = Math.min((W * 0.95) / mw, (H * 0.92) / mh); ay = 0.5; y = H * 0.5;
  } else if (FRAME === 'head') {        // 大頭貼：放大、貼頂只露臉+肩
    s = (W * 2.7) / mw; ay = 0.0; y = H * 0.03;
  } else {                              // half（預設）：半身特寫，錨點貼頂→頭頂必留邊、框到腰
    s = (W * 1.7) / mw; ay = 0.0; y = H * 0.04;
  }
  model.scale.set(s);
  model.anchor.set(0.5, ay);            // 水平置中；垂直依取景（0=貼頂、0.5=置中）
  model.x = W / 2;
  model.y = y;
}

// ---- 對外介面：Python 透過 runJavaScript 呼叫 ----
window.setPetState = function (state) {
  initialState = state;
  const m = STATE_INTENT[state] || STATE_INTENT.idle;
  if (SHOW_CAPTION) {
    captionEl.textContent = m.caption || '';
    captionEl.classList.toggle('show', !!m.caption);
  }
  if (!ready || !model) return;
  const exp = pickExpr(m.prefs, m.idx);
  try { if (exp) model.expression(exp); } catch (e) {}
  // 短暫狀態（等你回應 / 完成）觸發拍打動作增加生氣；待機/作業中靠自動 idle 動作
  try { if (m.motion === 'tap' && TAP_GROUP) model.motion(TAP_GROUP, undefined, 3 /*FORCE*/); } catch (e) {}
};

// ---- 逐像素輪廓遮罩：給 Python 端 setMask 用，讓窗的透明死區（腰下 + 左右 gutter）真正可點穿 ----
// 讀 canvas 的 alpha，逐 row band 算狗實際不透明區的 [minX,maxX] 水平 span → 回傳 logical px 矩形清單。
// 全透明的 row（腰下）整段不回 → 該區不納遮罩 → 可穿透；左右 gutter 依每列狗寬裁掉。
// 名牌/字幕是獨立 DOM，落在輪廓外會被 setMask 一起裁掉 → 顯示時把那條 strip 併進遮罩保住可見。
const MASK_ALPHA = 24;     // alpha 門檻（>= 此值視為不透明）
const MASK_ROW = 8;        // 遮罩 row 高（logical px），越小越貼合、矩形數越多
function computeMask() {
  if (!app || !model || !ready) return null;
  let data, pw, ph;
  try {
    // 直接從 #stage（WebGL canvas）drawImage 到一張 2D canvas 再 getImageData：
    // drawImage 保留 top-left origin（無 Y 翻轉問題），且因 app 開了 preserveDrawingBuffer，
    // 畫面內容讀得回來。比 extract.pixels()（bottom-up）/ extract.canvas()（對 Live2D 自訂
    // shader 擷取為空）都可靠。
    const sc = document.getElementById('stage');
    pw = sc.width; ph = sc.height;            // WebGL backing 尺寸（device px）
    const t = document.createElement('canvas'); t.width = pw; t.height = ph;
    const tx = t.getContext('2d'); tx.drawImage(sc, 0, 0);
    data = tx.getImageData(0, 0, pw, ph).data;  // RGBA，top-left origin
  } catch (e) { return null; }
  if (!data || !pw || !ph) return null;
  // logical = window CSS px，正是 win.setMask() 的座標空間；scale 由 canvas 實際尺寸推導，
  // 不依賴 renderer.resolution（實測它與 canvas backing 尺寸可能對不上 → 座標放大成 device px）。
  const Wl = window.innerWidth, Hl = window.innerHeight;
  const sx = pw / Wl, sy = ph / Hl;            // 每 logical px 對應幾個 canvas px
  const bands = Math.ceil(Hl / MASK_ROW);
  const minX = new Float64Array(bands).fill(Infinity);
  const maxX = new Float64Array(bands).fill(-1);
  const step = Math.max(1, Math.round(sy));    // 約每 logical px 取一列，省迴圈
  for (let py = 0; py < ph; py += step) {
    const band = Math.floor((py / sy) / MASK_ROW);
    if (band < 0 || band >= bands) continue;
    const baseRow = py * pw * 4;
    let lo = minX[band], hi = maxX[band];
    const stepx = Math.max(1, Math.round(sx));
    for (let px2 = 0; px2 < pw; px2 += stepx) {
      if (data[baseRow + px2 * 4 + 3] >= MASK_ALPHA) {
        const lx = px2 / sx;
        if (lx < lo) lo = lx;
        if (lx > hi) hi = lx;
      }
    }
    minX[band] = lo; maxX[band] = hi;
  }
  const PAD = 5;            // 水平外擴幾 px，避免邊緣抗鋸齒半透明被切出硬邊
  const out = [];
  for (let b = 0; b < bands; b++) {
    if (maxX[b] >= 0) {
      const x = Math.max(0, Math.floor(minX[b]) - PAD);
      const x2 = Math.min(Wl, Math.ceil(maxX[b]) + PAD);
      if (x2 > x) out.push([x, b * MASK_ROW, x2 - x, MASK_ROW]);
    }
  }
  if (NAME) out.push([0, 0, Wl, 22]);                                   // 名牌 strip（頂）
  if (captionEl.classList.contains('show'))                            // 字幕 strip（底）
    out.push([0, Math.max(0, Hl - 22), Wl, 22]);
  return out.length ? out : null;
}
window.__getPetMask = function () {
  try { return JSON.stringify(computeMask()); } catch (e) { return 'null'; }
};

boot();
</script>
</body>
</html>
